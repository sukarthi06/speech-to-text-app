server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Serve the file if it exists, otherwise let Angular handle the route
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
    }
}